<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#444;--line:#cfcfcf;--pt:#e8505b;--soft:#fdecee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo',sans-serif;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
h1{margin:0;font-size:22px}h2{margin:0 0 8px;font-size:16px;color:var(--pt)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button,select,input,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
button{border:0;background:var(--soft);color:var(--pt);border-radius:20px;padding:7px 14px;cursor:pointer}
button.main{background:var(--pt);color:#fff}
select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;min-width:0}
input:disabled,textarea:disabled{background:#faf9f7;color:#555;border-color:#e6e6e6}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{text-align:center;padding:8px 0;border-radius:10px;cursor:pointer;position:relative}
.cal .h{cursor:default;color:#999;font-size:12px;padding:2px}
.cal .d:hover{background:var(--soft)}.cal .sel{background:var(--pt);color:#fff}
.cal .today{outline:2px solid var(--pt)}.cal .has::after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#f5a623}
.months{display:flex;gap:4px;overflow-x:auto;margin-top:8px}.months button{padding:5px 10px;flex:none;background:#f1f1f1;color:#777}
.months button.on{background:var(--pt);color:#fff}
.sheet{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:720px){.sheet{grid-template-columns:1fr}}
.fld{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid #bbb;padding:5px 0}.fld label{width:80px;color:#888;font-size:12px}.fld input{flex:1;border:0;background:none}
.ck{display:grid;grid-template-columns:70px 1fr 34px 34px;border:1.5px solid #aaa;border-radius:8px;overflow:hidden}
.ck>*{border:0;border-bottom:1px solid var(--line);border-radius:0;height:36px}.ck input{border-right:1px solid var(--line)}
.ck button{background:#fff;font-size:17px;padding:0;opacity:.3;border-left:1px solid var(--line)}.ck button.on{opacity:1;background:var(--soft)}
textarea{width:100%;min-height:150px;resize:vertical;margin-top:6px}
.tt{border:1.5px solid #aaa;border-radius:8px;overflow:hidden}
.tr{display:grid;grid-template-columns:30px repeat(6,1fr);height:24px;border-bottom:1px solid #e3e3e3}
.tr:last-child{border:0}.tr span{font-size:11px;color:#999;text-align:center;line-height:24px;border-right:1px solid #ddd}
.tr i{border-right:1px solid #eee;font-style:normal;font-size:10px;overflow:visible;white-space:nowrap;color:#fff;position:relative;z-index:1;padding-left:2px;line-height:24px}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw b{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px #ccc}.sw b.on{box-shadow:0 0 0 2px #444}
